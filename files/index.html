<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的快捷方式</title>

  <!-- 安卓 Chrome 靠这个认自定义图标 -->
  <link rel="manifest" href="manifest.json">

  <!-- iPhone Safari 靠这个认自定义图标 -->
  <link rel="apple-touch-icon" href="icon-192.png">

  <meta name="theme-color" content="#12141a">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #12141a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a.open-btn {
      color: #fff;
      background: #2a2d3a;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <!-- 不再自动跳转：先留在这个页面，让"添加到主屏幕"抓到的是这个页面自己的图标/manifest。
       加到主屏幕之后，图标会靠 manifest.json 的 start_url 直接打开 Artifact，效果一样。
       这个按钮是给你直接在浏览器里点开用的（不影响主屏幕图标那边的行为）。 -->
  <a class="open-btn" href="https://claude.ai/artifact/RqyNs86LewSVtB1TTtwVs4">打开我的快捷方式</a>

</html>
